services:
  - type: web
    name: iris-ml-webapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Bind gunicorn to Render's $PORT so health checks always pass.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FLASK_ENV
        value: production
